services:
  app-update-server:
    # :latest tracks the newest v* tag. Pin to :1 or :1.2.3 to control upgrades.
    image: ghcr.io/mcanyucel/app-update-server:latest
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Auth__ApiKey=${APP_UPDATE_SERVER_API_KEY}
      # Largest accepted upload, in bytes. Defaults to 1 GiB.
      # - Storage__MaxUploadBytes=2147483648
      # Only trust Remote-User from your reverse proxy's own address — find it
      # with `docker network inspect proxy`. A bare address matches that host
      # exactly; a CIDR range trusts every container in it.
      # - Auth__TrustedProxies=172.18.0.11
    volumes:
      - app-update-server-data:/data
    networks:
      - proxy

volumes:
  app-update-server-data:

networks:
  proxy:
    external: true
