services:
  app-update-server:
    image: ghcr.io/mcanyucel/app-update-server:main
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Auth__ApiKey=${APP_UPDATE_SERVER_API_KEY}
      # Largest accepted upload, in bytes. Defaults to 1 GiB.
      # - Storage__MaxUploadBytes=2147483648
      # Only trust Remote-User from your reverse proxy. Find the range with
      # `docker network inspect proxy`.
      # - Auth__TrustedProxies=172.18.0.0/16
    volumes:
      - app-update-server-data:/data
    networks:
      - proxy

volumes:
  app-update-server-data:

networks:
  proxy:
    external: true
